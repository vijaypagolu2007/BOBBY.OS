name: Deploy Staging Preview

on:
  pull_request:
    paths:
      - 'css/**'
      - 'js/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'firebase.json'
  workflow_dispatch:
    inputs:
      project_id:
        description: Firebase project ID to deploy to
        required: false
        type: string

permissions:
  contents: read

jobs:
  preview:
    name: Deploy Hosting preview
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: firebase-hosting-preview-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    env:
      FIREBASE_PROJECT_ID: ${{ inputs.project_id || secrets.FIREBASE_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Hosting preview channel
        run: npx firebase-tools@latest hosting:channel:deploy "pr-${{ github.event.pull_request.number || github.run_id }}" --expires 7d --project "$FIREBASE_PROJECT_ID"
