name: Deploy Staging Preview

on:
  pull_request:
    paths:
      - 'css/**'
      - 'js/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'firebase.json'
  workflow_dispatch:
    inputs:
      project_id:
        description: Firebase project ID to deploy to
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  preview:
    name: Deploy Hosting preview
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.fork == false) && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: firebase-hosting-preview-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    env:
      FIREBASE_PROJECT_ID: ${{ inputs.project_id || secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Validate deployment authentication
        shell: bash
        run: |
          if [[ -z "$FIREBASE_PROJECT_ID" ]]; then
            echo "::error::Set FIREBASE_PROJECT_ID or provide the workflow_dispatch project_id input."
            exit 1
          fi
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" && ( -z "$WIF_PROVIDER" || -z "$WIF_SERVICE_ACCOUNT" ) ]]; then
            echo "::error::Set FIREBASE_SERVICE_ACCOUNT, or set both WIF_PROVIDER and WIF_SERVICE_ACCOUNT."
            exit 1
          fi

      - name: Authenticate with service-account JSON
        id: auth-sa
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Authenticate with Workload Identity Federation
        id: auth-wif
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT == '' && env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      # firebase-tools does not support WIF external_account credential files.
      # We work around this by obtaining a short-lived OAuth2 access token from
      # gcloud (which already has WIF credentials loaded) and passing it as
      # FIREBASE_TOKEN, which firebase-tools does honour in CI environments.
      # With WIF the active identity is the pool principal, not the SA — we must
      # impersonate the SA explicitly to get an OAuth2 access token for it.
      - name: Obtain short-lived Firebase token from gcloud
        id: firebase-token
        shell: bash
        env:
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          # Use SA impersonation for WIF; fall back to direct ADC for SA-JSON
          if [[ -n "${WIF_SERVICE_ACCOUNT:-}" ]]; then
            TOKEN=$(gcloud auth print-access-token --impersonate-service-account="$WIF_SERVICE_ACCOUNT")
          else
            TOKEN=$(gcloud auth print-access-token)
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "::notice::Firebase access token obtained (${#TOKEN} chars)"

      - name: Deploy Firebase Hosting preview channel
        env:
          FIREBASE_TOKEN: ${{ steps.firebase-token.outputs.token }}
        run: npx firebase-tools@latest hosting:channel:deploy "pr-${{ github.event.pull_request.number || github.run_id }}" --expires 7d --project "$FIREBASE_PROJECT_ID"
