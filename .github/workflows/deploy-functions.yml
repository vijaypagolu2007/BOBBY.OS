name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
  workflow_dispatch:
    inputs:
      project_id:
        description: Firebase project ID to deploy to
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy functions
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: firebase-functions-production
      cancel-in-progress: false
    env:
      FIREBASE_PROJECT_ID: ${{ inputs.project_id || secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Validate deployment authentication
        shell: bash
        run: |
          if [[ -z "$FIREBASE_PROJECT_ID" ]]; then
            echo "::error::Set FIREBASE_PROJECT_ID or provide the workflow_dispatch project_id input."
            exit 1
          fi
          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" && ( -z "$WIF_PROVIDER" || -z "$WIF_SERVICE_ACCOUNT" ) ]]; then
            echo "::error::Set FIREBASE_SERVICE_ACCOUNT, or set both WIF_PROVIDER and WIF_SERVICE_ACCOUNT."
            exit 1
          fi

      - name: Authenticate with service-account JSON
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Authenticate with Workload Identity Federation
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT == '' && env.WIF_PROVIDER != '' && env.WIF_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Functions
        run: npx firebase-tools@latest deploy --only functions --project "$FIREBASE_PROJECT_ID" --ci
